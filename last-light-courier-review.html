<script>
(()=>{'use strict';
const levels=[
 {name:'The First Light',brief:'Visit the house, then return to the depot and bank the delivery.',need:1,light:18,rows:['........','........','........','...H....','........','........','..D.....','........']},
 {name:'Two Windows',brief:'Choose a nearby delivery. You may visit both before banking.',need:1,light:18,rows:['........','........','..H...H.','........','........','........','...D....','........']},
 {name:'Fallen Crates',brief:'A blocked street creates a detour. The marked crate can be cleared with banked points.',need:2,light:20,repair:{at:[4,3],price:150},rows:['........','........','..H...H.','........','...RXX..','........','..D..H..','........']},
 {name:'The Watcher Wakes',brief:'The shadow starts patrolling after your first delivery. Watch its next marked tile.',need:2,light:22,patrol:[[4,2],[4,3],[4,4],[4,5],[4,4],[4,3]],wake:true,rows:['........','........','..H...H.','........','........','........','..D..H..','........']},
 {name:'Change the Timing',brief:'A side step can shift the patrol before you cross the middle street.',need:2,light:23,patrol:[[3,3],[3,4],[4,4],[4,3]],rows:['........','...H....','........','........','........','........','..D..H..','......H.']},
 {name:'Rubble Road',brief:'Two blocks split the return routes. Clear the marked rubble for a shortcut.',need:2,light:24,repair:{at:[4,4],price:400},patrol:[[3,3],[3,4],[3,5],[3,4]],rows:['........','........','..H...H.','........','..XXR...','........','..D..H..','........']},
 {name:'Three Lanterns',brief:'Try all three houses. A full return earns a mastery bonus.',need:2,light:27,patrol:[[4,3],[4,4],[4,5],[4,4]],rows:['........','........','..H...H.','........','........','........','...D.H..','........']},
 {name:'One More Window',brief:'Bank two deliveries safely, or stretch the lantern for a third.',need:2,light:18,patrol:[[4,2],[4,3],[4,4],[4,5],[4,4],[4,3]],rows:['......H.','........','..H.....','........','........','........','..D..H..','........']},
 {name:'Dark Streetlamp',brief:'The dark tile costs two light. Relight it from an adjacent square to restore the normal cost.',need:2,light:20,repair:{at:[6,4],price:600,dark:true},patrol:[[3,3],[3,4],[3,5],[3,4]],rows:['........','........','..H...H.','........','........','........','..D.RH..','........']},
 {name:'The Last Round',brief:'Finale: deliver to all three houses, read the patrol, and return to bank.',need:3,light:16,repair:{at:[4,4],price:1150},patrol:[[3,2],[3,3],[3,4],[3,5],[3,4],[3,3]],rows:['........','........','..H...H.','........','...XR...','........','..D..H..','........']}
];
const key='llc_review_first10_v3';let saved={cleared:{},wallet:0,repairs:{},view:'isometric'};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{};let screen='home',index=0,run=null,dialog=null,motion=null;
const app=document.querySelector('#app'),coord=(r,c)=>r*8+c, rc=n=>[Math.floor(n/8),n%8],money=n=>n.toLocaleString();
function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}
function setup(i){index=i;const l=levels[i],houses=[],walls=new Set(),darks=new Set();let depot=-1;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const ch=l.rows[r][c],p=coord(r,c);if(ch==='H')houses.push(p);if(ch==='D')depot=p;if(ch==='X'||ch==='R')walls.add(p);if(ch==='R'&&l.repair?.dark){walls.delete(p);darks.add(p)}}if(saved.repairs?.[i]){walls.delete(coord(...l.repair.at));darks.delete(coord(...l.repair.at))}run={pos:depot,depot,houses,walls,darks,delivered:new Set(),pending:0,light:l.light,turn:0,shadowStep:0,active:!!l.patrol&&!l.wake,status:'Choose a glowing green tile or use the D-pad. Reach a house, then return to the depot.',ended:false};screen='game';dialog=null;motion=null;render()}
function shadowAt(step){const p=levels[index].patrol;return p?coord(...p[step%p.length]):-1}
function nextShadow(){return run.active?shadowAt(run.shadowStep+1):-1}
function moveKind(p){if(!run||run.ended||p<0||p>63)return 'closed';const [r,c]=rc(p),[pr,pc]=rc(run.pos);if(Math.abs(r-pr)+Math.abs(c-pc)!==1||run.walls.has(p))return 'closed';const cost=run.darks.has(p)?2:1;if(run.light<cost)return 'dark';if(run.active&&(p===shadowAt(run.shadowStep)||p===nextShadow()))return 'danger';return cost===2?'costly':'safe'}
function move(dr,dc){if(screen!=='game'||run.ended||dialog)return;const [r,c]=rc(run.pos),nr=r+dr,nc=c+dc;if(nr<0||nr>7||nc<0||nc>7)return;const p=coord(nr,nc),kind=moveKind(p);if(kind==='closed'){run.status='That street is blocked. Choose a green tile or a different D-pad direction.';render();return}if(kind==='danger'){run.status='Red means the shadow occupies this tile now or reaches it next. Choose a green move.';render();return}if(kind==='dark'){fail('The lantern has no light for that move.');return}const old=run.pos,oldShadow=run.active?shadowAt(run.shadowStep):-1,cost=run.darks.has(p)?2:1;run.light-=cost;run.pos=p;run.turn++;if(run.active)run.shadowStep++;let delivered=false;const hi=run.houses.indexOf(p);if(hi>=0&&!run.delivered.has(p)){run.delivered.add(p);run.pending+=[120,180,240][hi];run.light=Math.min(levels[index].light,run.light+2);delivered=true;if(levels[index].wake&&!run.active){run.active=true;run.shadowStep=0}}if(run.light===0&&run.pos!==run.depot){fail('The lantern ran out before you reached the depot.');return}motion={from:old,to:p,shadowFrom:oldShadow,shadowTo:run.active?shadowAt(run.shadowStep):-1,start:performance.now()};run.status=delivered?`House lit. +2 light and ${[120,180,240][hi]} points at risk. ${run.delivered.size} of ${run.houses.length} houses visited.`:run.pos===run.depot&&run.delivered.size?'You are home. Tap Bank run to keep these points.':'Green tiles are safe next moves; red tiles are blocked by the shadow.';render()}
function fail(message){run.ended=true;dialog={title:'The light went out',body:`${message} Unbanked points from this run were lost.`,actions:[['Retry',()=>setup(index)],['Level map',()=>showPicker()]]};render()}
function bank(){if(!run||run.ended||run.pos!==run.depot||!run.delivered.size)return;const earned=run.pending,mastery=run.delivered.size===3?100:0,cleared=run.delivered.size>=levels[index].need,total=earned+mastery;saved.wallet+=total;if(cleared)saved.cleared[index]=true;persist();run.ended=true;dialog={title:cleared?'Delivery complete':'Safe return',body:`${run.delivered.size} house${run.delivered.size===1?'':'s'} · ${earned} delivery points${mastery?' · 100 mastery bonus':''}. Banked ${total}. Wallet: ${money(saved.wallet)}.${cleared?' Level cleared.':' Visit more houses to clear this level.'}`,actions:[['Retry',()=>setup(index)],...(cleared&&index<9?[['Next level',()=>setup(index+1)]]:[]),['Level map',()=>showPicker()]]};render()}
function repair(){const l=levels[index];if(!l.repair||saved.repairs?.[index]||run.ended)return;const p=coord(...l.repair.at),[r,c]=rc(run.pos),[rr,cc]=l.repair.at;if(Math.abs(r-rr)+Math.abs(c-cc)!==1){run.status='Stand beside the marked tile to repair it.';render();return}if(saved.wallet<l.repair.price){run.status=`This repair costs ${money(l.repair.price)} points. Wallet: ${money(saved.wallet)}.`;render();return}saved.wallet-=l.repair.price;saved.repairs[index]=true;run.walls.delete(p);run.darks.delete(p);persist();run.status=`Street repaired for ${money(l.repair.price)} points. The change stays on retries.`;render()}
function tileGeometry(r,c){const iso=saved.view==='isometric',x=iso?400+(c-r)*45.5:120+c*80,y=iso?72+(c+r)*31.8:55+r*65,w=iso?92:70,h=iso?61:60;return `left:${(x-w/2)/8}%;top:${(y-h/2)/6}%;width:${w/8}%;height:${h/6}%`}
function tileHTML(l,r,c){const p=coord(r,c),ch=l.rows[r][c],kind=moveKind(p),classes=['tile'];if(kind==='safe'||kind==='costly'||kind==='danger')classes.push(kind);const label=`Row ${r+1} column ${c+1}${ch==='H'?' house':''}${ch==='D'?' depot':''}${kind==='safe'?' safe next move':kind==='costly'?' safe next move, costs two light':kind==='danger'?' shadow blocked':''}`;return `<button class="${classes.join(' ')}" style="${tileGeometry(r,c)}" data-tile="${p}" aria-label="${label}" ${run.ended||kind==='closed'||kind==='danger'?'disabled':''}></button>`}
const VIEWS=[['isometric','Isometric Village','Raised streets and warm windows','⌂'],['overhead','Storybook Overhead','Clear square streets and routes','▦'],['night','Night Pursuit','Darker lantern-lit streets','☾']];
let frame=0;
function renderScene(){const canvas=document.querySelector('#scene');if(!canvas||!run)return;cancelAnimationFrame(frame);const ctx=canvas.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);canvas.width=800*dpr;canvas.height=600*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const mode=saved.view,iso=mode==='isometric',night=mode==='night',l=levels[index];
 const xy=p=>{const [r,c]=rc(p);return iso?[400+(c-r)*45.5,72+(c+r)*31.8]:[120+c*80,55+r*65]};
 const poly=(points,fill,stroke,width=1)=>{ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}};
 const round=(x,y,w,h,r,fill,stroke)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.4;ctx.stroke()}};
 const circle=(x,y,r,fill)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()};
 function house(x,y,done,depot){ctx.save();ctx.shadowColor=done?'#ffd789':'#101f2a';ctx.shadowBlur=done?22:8;ctx.shadowOffsetY=5;round(x-20,y-22,40,30,3,depot?'#42677a':done?'#bd8666':'#806f69','#ead3ab');ctx.shadowBlur=0;ctx.shadowOffsetY=0;poly([[x-25,y-20],[x,y-43],[x+25,y-20]],depot?'#7fa1aa':'#724e56','#e6b889',2);round(x-5,y-3,10,11,2,'#3b3b43');for(const wx of [-13,8])round(x+wx,y-13,6,7,1,done||depot?'#ffe09a':'#5a525e','#e9c18a');if(done){circle(x+17,y-31,5,'#ffe4a0');ctx.fillStyle='#173c3d';ctx.font='bold 8px sans-serif';ctx.fillText('✓',x+14,y-28)}if(depot){ctx.fillStyle='#fce0aa';ctx.font='bold 10px sans-serif';ctx.fillText('DEPOT',x-18,y+23)}ctx.restore()}
 function obstacle(x,y,repair){ctx.save();ctx.shadowColor='#071820';ctx.shadowBlur=8;ctx.shadowOffsetY=5;round(x-17,y-12,34,25,3,repair?'#aa7351':'#745a4b','#e0bd8d');ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#d8ad79';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-12,y-8);ctx.lineTo(x+12,y+9);ctx.moveTo(x+12,y-8);ctx.lineTo(x-12,y+9);ctx.stroke();if(repair){round(x-19,y+13,38,12,3,'#f0c579');ctx.fillStyle='#342f33';ctx.font='bold 8px sans-serif';ctx.fillText('REPAIR',x-16,y+22)}ctx.restore()}
 function lamp(x,y,dim){ctx.strokeStyle='#80959a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y+19);ctx.lineTo(x,y-23);ctx.lineTo(x+12,y-23);ctx.stroke();circle(x+12,y-20,7,dim?'#8c81a2':'#ffda83');if(!dim){ctx.save();ctx.shadowColor='#ffdb82';ctx.shadowBlur=25;circle(x+12,y-20,5,'#ffeab3');ctx.restore()}}
 function courier(x,y){ctx.save();ctx.shadowColor='#ffe0a0';ctx.shadowBlur=22;circle(x+15,y-3,8,'#ffd887');ctx.shadowBlur=0;circle(x,y-22,10,'#dbb896');poly([[x-14,y-13],[x,y-20],[x+14,y-13],[x+17,y+13],[x-17,y+13]],'#b44d48','#e7aa7d',2);poly([[x-14,y-17],[x,y-34],[x+14,y-17]],'#6a4d61','#d1a08a',1.5);ctx.strokeStyle='#d4af8e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+8,y-4);ctx.lineTo(x+15,y-3);ctx.stroke();circle(x+15,y-3,4,'#fff0bc');ctx.restore()}
 function shadow(x,y){ctx.save();ctx.shadowColor='#c68bd9';ctx.shadowBlur=19;ctx.fillStyle='#5e426f';ctx.beginPath();ctx.moveTo(x-14,y+13);ctx.quadraticCurveTo(x-18,y-5,x-8,y-20);ctx.quadraticCurveTo(x,y-29,x+8,y-20);ctx.quadraticCurveTo(x+19,y-5,x+14,y+13);ctx.lineTo(x+7,y+8);ctx.lineTo(x,y+14);ctx.lineTo(x-7,y+8);ctx.closePath();ctx.fill();ctx.shadowBlur=0;circle(x-5,y-9,2.3,'#ffc4d2');circle(x+5,y-9,2.3,'#ffc4d2');ctx.restore()}
 function paint(){const bg=ctx.createRadialGradient(420,230,30,400,310,570);bg.addColorStop(0,night?'#34405c':iso?'#294958':'#445f5d');bg.addColorStop(1,night?'#0c1128':'#102832');ctx.fillStyle=bg;ctx.fillRect(0,0,800,600);ctx.fillStyle='#ffffff21';for(let i=0;i<30;i++){const x=(i*173)%800,y=(i*97)%600;circle(x,y,i%4===0?1.6:1,'#f8e8ca77')}
  const tiles=Array.from({length:64},(_,p)=>p).sort((a,b)=>{const [ar,ac]=rc(a),[br,bc]=rc(b);return iso?ar+ac-(br+bc):a-b});
  for(const p of tiles){const [r,c]=rc(p),[x,y]=xy(p),ch=l.rows[r][c],repaired=saved.repairs?.[index]&&l.repair&&p===coord(...l.repair.at),wall=run.walls.has(p),dark=run.darks.has(p),done=run.delivered.has(p),kind=moveKind(p);let floor=wall?'#4b5862':dark?'#42455c':done?'#866f59':ch==='D'?'#4b777c':(r+c)%2?'#456a70':'#53777a';if(night)floor=wall?'#384057':dark?'#33354e':done?'#695869':ch==='D'?'#395c68':(r+c)%2?'#344c5a':'#3a5260';if(mode==='overhead')floor=wall?'#65706c':dark?'#595765':done?'#91775d':ch==='D'?'#698680':(r+c)%2?'#69877e':'#76938a';const edge=kind==='danger'?'#ff9da8':kind==='safe'?'#aff8d6':kind==='costly'?'#f7d991':done?'#f4d198':'#96aeb0';
   ctx.save();ctx.shadowColor=kind==='danger'?'#ee7b8a':kind==='safe'?'#a7f6d1':'#06121a';ctx.shadowBlur=kind==='danger'||kind==='safe'?15:8;
   if(iso){poly([[x-45,y],[x,y+29],[x,y+38],[x-45,y+9]],'#203c48','#152e39');poly([[x,y+29],[x+45,y],[x+45,y+9],[x,y+38]],'#162f3c','#102633');poly([[x,y-29],[x+45,y],[x,y+29],[x-45,y]],floor,edge,kind==='safe'||kind==='danger'?3:1.4)}else round(x-34,y-29,68,58,5,floor,edge);ctx.restore();
   if(!wall&&ch==='.') {ctx.strokeStyle=night?'#94a7ae24':'#c8d7bd38';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-11,y+5);ctx.lineTo(x-3,y+8);ctx.moveTo(x+9,y-8);ctx.lineTo(x+16,y-5);ctx.stroke()}
   if(ch==='H')house(x,y,done,false);if(ch==='D')house(x,y,false,true);if(wall)obstacle(x,y,ch==='R');if(dark||ch==='R'&&l.repair?.dark&&!repaired)lamp(x,y,true);if(repaired&&ch==='R'&&!l.repair?.dark)lamp(x,y,false);
  }
  const elapsed=motion?Math.min(1,(performance.now()-motion.start)/240):1,eased=1-Math.pow(1-elapsed,3),a=motion&&motion.from>=0?xy(motion.from):xy(run.pos),b=xy(run.pos),cx=a[0]+(b[0]-a[0])*eased,cy=a[1]+(b[1]-a[1])*eased;ctx.save();ctx.shadowColor='#f5d892';ctx.shadowBlur=22;circle(cx,cy+17,15,'#f5ca7050');ctx.restore();courier(cx,cy);
  if(run.active){const sa=motion&&motion.shadowFrom>=0?xy(motion.shadowFrom):xy(shadowAt(run.shadowStep)),sb=xy(shadowAt(run.shadowStep));shadow(sa[0]+(sb[0]-sa[0])*eased,sa[1]+(sb[1]-sa[1])*eased)}
  if(night){const shade=ctx.createRadialGradient(cx,cy,30,cx,cy,370);shade.addColorStop(0,'#080e2700');shade.addColorStop(1,'#080e2799');ctx.fillStyle=shade;ctx.fillRect(0,0,800,600)}
  if(motion&&elapsed<1)frame=requestAnimationFrame(paint);else motion=null;
 };paint()}
function renderHome(){app.innerHTML=`<section class="home"><div class="hero"><div class="kicker">A route home, before the last light</div><h1>Carry the <em>light.</em><br>Find your way <em>back.</em></h1><p>Bring a lantern to stranded homes. Each step spends light. Each delivery changes the journey. Return to the depot to bank what you earned.</p><div class="actions"><button class="primary" data-action="play">${Object.keys(saved.cleared).length?'Continue journey':'Begin journey'} →</button><button class="secondary" data-action="picker">Choose level</button><button class="secondary" data-action="how">How to play</button><button class="secondary" data-action="settings">Settings</button></div><div class="hero-foot">10 selectable levels · ${Object.keys(saved.cleared).length} cleared · ${money(saved.wallet)} points in wallet</div></div><div class="illustration"><div class="moon"></div><div class="scene">🏮</div><div class="scene-caption">One light. A whole city waiting.</div></div></section>`}
function renderPicker(){app.innerHTML=`<section class="panel picker"><div class="picker-top"><div><div class="chapter">Chapter one · First deliveries</div><h2>Choose a level</h2></div><button class="small" data-action="home">Main menu</button></div><div class="notice">Review layouts: the original legacy map geometry was missing from the handover. These ten playable maps follow the level briefs and are open for design feedback. A separate 1,000-map experimental archive exists for later review; it is not presented as approved legacy campaign geometry.</div><div class="grid-levels">${levels.map((l,i)=>`<button class="level-card" data-level="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="name">${l.name}</span><span class="flag">${saved.cleared[i]?'✓ Cleared':'Open for review'} · ${l.need} ${l.need===1?'house':'houses'}</span></button>`).join('')}</div></section>`}
function renderGame(){const l=levels[index],pct=Math.max(0,run.light/l.light*100),repairStatus=l.repair?`${saved.repairs?.[index]?'Repaired':`${l.repair.dark?'Relight lamp':'Clear blockage'} · ${money(l.repair.price)} points`}`:'';app.innerHTML=`<div class="level-head"><div><div class="chapter">Chapter one · First deliveries</div><h2>${String(index+1).padStart(2,'0')} / ${l.name}</h2><p class="muted">${l.brief}</p></div><div class="navigation"><button class="nav-btn" data-action="prev" ${index===0?'disabled':''} aria-label="Previous level">←</button><button class="nav-btn" data-action="picker">Levels</button><button class="nav-btn" data-action="next" ${index===9?'disabled':''} aria-label="Next level">→</button><button class="nav-btn" data-action="settings">Settings</button></div></div><div class="notice">Playable review prototype · Original Sep 27 maps are unavailable · Levels are freely selectable.</div><div class="game"><div class="board-wrap"><div class="board view-${saved.view}"><canvas id="scene" aria-hidden="true"></canvas>${Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>tileHTML(l,r,c)).join('')).join('')}</div><div class="board-note"><span>Tap a green neighbor or use the D-pad</span><span>${run.active?'Red marks a shadow-blocked move':'Shadow: '+(l.patrol?'waiting':'none')}</span></div></div><aside class="side"><div class="panel"><div class="stats"><div class="stat"><span>Light</span><strong>${run.light}/${l.light}</strong></div><div class="stat"><span>Houses</span><strong>${run.delivered.size}/${l.need}</strong></div><div class="stat"><span>Wallet</span><strong>${money(saved.wallet)}</strong></div></div><div class="meter"><i style="width:${pct}%"></i></div></div><div class="panel brief"><strong>Objective</strong><br>Deliver to ${l.need} ${l.need===1?'house':'houses'} and bank at the depot. Each house restores 2 light. All three houses give a 100 point bonus.${l.repair?`<br><br><strong>Optional repair</strong><br>${repairStatus}. Stand beside the marked tile, then tap Repair.`:''}</div><div class="status" role="status">${run.status}</div><div><div class="chapter" style="text-align:center;margin-bottom:8px">D-pad · tile taps also work</div><div class="controls"><button class="up" data-move="-1,0" aria-label="Move up">↑</button><button class="left" data-move="0,-1" aria-label="Move left">←</button><button class="down" data-move="1,0" aria-label="Move down">↓</button><button class="right" data-move="0,1" aria-label="Move right">→</button></div></div><div class="side-actions"><button class="primary" data-action="bank" ${run.ended||run.pos!==run.depot||!run.delivered.size?'disabled':''}>Bank run</button><button class="secondary" data-action="restart">Restart</button>${l.repair?`<button class="small" data-action="repair" ${run.ended||saved.repairs?.[index]?'disabled':''}>${saved.repairs?.[index]?'Repaired':'Repair tile'}</button>`:''}<button class="small" data-action="how">Rules</button></div><div class="legend"><b>⌂</b> depot / house &nbsp; <b>✦</b> delivered &nbsp; <b>▥</b> blocked &nbsp; <b>◈</b> shadow &nbsp; <b>☾</b> dark tile</div></aside></div>`}
function renderDialog(){if(!dialog)return;const el=document.createElement('div');el.className='overlay';el.innerHTML=`<div class="dialog ${dialog.settings?'settings-dialog':''}" role="dialog" aria-modal="true"><div class="chapter">Last Light Courier</div><h2>${dialog.title}</h2><p>${dialog.body}</p>${dialog.settings?`<div class="settings-grid">${VIEWS.map(([id,name,description,icon])=>`<button class="view-choice ${saved.view===id?'selected':''}" data-view="${id}" aria-pressed="${saved.view===id}"><span class="preview">${icon}</span><strong>${name}</strong><small>${description}</small></button>`).join('')}</div>`:''}<div class="actions">${dialog.actions.map((a,i)=>`<button class="${i===0?'primary':'secondary'}" data-dialog="${i}">${a[0]}</button>`).join('')}</div></div>`;app.append(el)}
function render(){if(screen==='home')renderHome();if(screen==='picker')renderPicker();if(screen==='game'){renderGame();renderScene()}renderDialog()}
function showPicker(){screen='picker';dialog=null;render()}
function how(){dialog={title:'How to play',body:'Tap a green neighboring tile or use the D-pad. Green shows legal next moves, red shows shadow-blocked moves, and gold costs 2 light. Each delivery restores 2 light. Return to the depot and tap Bank run to keep points. Stand beside a marked repair to buy it with banked points. The three views change only presentation.',actions:[['Got it',()=>{dialog=null;render()}]]};render()}
function settings(){dialog={settings:true,title:'Choose your view',body:'Select a board view. Your position, shadow phase, light, deliveries, and points stay as they are.',actions:[['Close',()=>{dialog=null;render()}]]};render()}
app.addEventListener('click',e=>{const choice=e.target.closest('[data-view]');if(choice&&dialog?.settings){saved.view=choice.dataset.view;persist();dialog=null;render();return}const d=e.target.closest('[data-dialog]');if(d&&dialog){dialog.actions[Number(d.dataset.dialog)][1]();return}if(dialog)return;const level=e.target.closest('[data-level]');if(level){setup(Number(level.dataset.level));return}const tile=e.target.closest('[data-tile]');if(tile&&run){const [r,c]=rc(Number(tile.dataset.tile)),[pr,pc]=rc(run.pos);if(Math.abs(r-pr)+Math.abs(c-pc)===1)move(r-pr,c-pc);return}const mv=e.target.closest('[data-move]');if(mv){const [dr,dc]=mv.dataset.move.split(',').map(Number);move(dr,dc);return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='play')setup(Math.min(9,Object.keys(saved.cleared).length));if(a==='picker')showPicker();if(a==='home'){screen='home';render()}if(a==='prev')setup(index-1);if(a==='next')setup(index+1);if(a==='restart')setup(index);if(a==='bank')bank();if(a==='repair')repair();if(a==='how')how();if(a==='settings')settings()});document.addEventListener('keydown',e=>{if(screen!=='game'||dialog)return;const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]}[e.key];if(m){e.preventDefault();move(...m)}});render();
})();
</script>
