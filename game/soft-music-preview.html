<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Last Light Courier · softer music sample</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#29425a,#0a1728 65%);color:#f9e6c7;font:15px/1.5 Arial,sans-serif}.card{width:min(90vw,420px);padding:24px;border:1px solid #bc9160;border-radius:18px;background:#20374bdc;box-shadow:0 20px 55px #0008}h1{font:700 28px Georgia,serif;margin:0 0 9px}p{color:#d7e1e8}button,select{min-height:43px;border:1px solid #ecc48a;border-radius:9px;background:#f0c178;color:#2f251e;font-weight:800;padding:8px 12px}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}label{display:grid;gap:7px;margin:14px 0;color:#ffdda6}select{background:#314c60;color:#fff1d5;width:100%}input{accent-color:#f0be75;width:100%}.note{font-size:12px;color:#b9cad5}</style></head><body><main class="card"><h1>A gentler journey</h1><p>Short, warm notes with quiet gaps replace the continuous hum. Listen for a few phrases, then try another region.</p><div class="row"><button id="play">Play sample</button><button id="pause">Pause</button></div><label>Region<select id="region"><option value="0">Ember Road</option><option value="2">Waterline</option><option value="4">Winter Crossing</option><option value="8">Blackout</option><option value="19">The Last Light</option></select></label><label>Music level <output id="out">35%</output><input id="volume" type="range" min="0" max="100" value="35"></label><p class="note">Browser audio starts after Play. The same music engine is used in the playable HTML.</p></main><script src="ambient.js"></script><script>const music=new LLCAmbient(),volume=document.getElementById('volume'),region=document.getElementById('region');function update(){music.update({region:Number(region.value),light:20,cap:20,musicOn:true,volume:Number(volume.value)/100});document.getElementById('out').textContent=volume.value+'%'}document.getElementById('play').onclick=()=>{update();music.start()};document.getElementById('pause').onclick=()=>music.update({musicOn:false});volume.oninput=update;region.onchange=update;update();</script></body></html>
